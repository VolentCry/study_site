<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef9c3"/>
        <stop offset="50%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#fde047"/>
      </linearGradient>
      <linearGradient id="rollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ca8a04"/>
        <stop offset="50%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#a16207"/>
      </linearGradient>
      <filter id="shadowScroll" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="116" rx="34" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowScroll)">
      <!-- Main Unrolled Sheet -->
      <path d="M 28 30 C 44 26 84 26 100 30 L 100 96 C 84 92 44 92 28 96 Z" fill="url(#parchment)"/>
      <!-- Top Roll Cylinder -->
      <ellipse cx="64" cy="28" rx="38" ry="9" fill="url(#rollGrad)"/>
      <ellipse cx="26" cy="28" rx="7" ry="9" fill="#a16207"/>
      <ellipse cx="26" cy="28" rx="4" ry="6" fill="#713f12"/>
      <!-- Bottom Roll Cylinder -->
      <ellipse cx="64" cy="98" rx="38" ry="9" fill="url(#rollGrad)"/>
      <ellipse cx="102" cy="98" rx="7" ry="9" fill="#ca8a04"/>
      <!-- Inscription text lines / math symbols -->
      <line x1="38" y1="48" x2="88" y2="48" stroke="#a16207" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="60" x2="72" y2="60" stroke="#a16207" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="72" x2="82" y2="72" stroke="#a16207" stroke-width="3" stroke-linecap="round"/>
      <!-- Red Wax Seal Ribbon -->
      <path d="M 64 88 L 60 114 L 64 110 L 68 114 Z" fill="#ef4444"/>
      <circle cx="64" cy="88" r="9" fill="#dc2626"/>
      <circle cx="64" cy="88" r="6" fill="#b91c1c"/>
      <circle cx="62" cy="86" r="2" fill="#fca5a5"/>
