<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#b91c1c"/>
        <stop offset="50%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#991b1b"/>
      </linearGradient>
      <radialGradient id="bronzeCoin" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fed7aa"/>
        <stop offset="35%" stop-color="#fb923c"/>
        <stop offset="75%" stop-color="#c2410c"/>
        <stop offset="100%" stop-color="#7c2d12"/>
      </radialGradient>
      <filter id="shadowMedalB" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#431407" flood-opacity="0.35"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="118" rx="30" ry="5" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowMedalB)">
      <!-- Ribbon -->
      <polygon points="46,14 64,48 40,60 30,22" fill="url(#ribbonRed)"/>
      <polygon points="82,14 64,48 88,60 98,22" fill="url(#ribbonRed)"/>
      <!-- Bronze Medallion Rim -->
      <circle cx="64" cy="74" r="38" fill="#7c2d12"/>
      <circle cx="64" cy="74" r="35" fill="url(#bronzeCoin)"/>
      <circle cx="64" cy="74" r="28" fill="none" stroke="#fed7aa" stroke-width="2.5" opacity="0.7"/>
      <!-- Roman III / 3D Star -->
      <polygon points="64,56 67,65 77,66 69,73 72,82 64,77 56,82 59,73 51,66 61,65" fill="#ffedd5"/>
      <!-- Highlight crescent -->
      <path d="M 40 58 C 50 44 78 44 88 58 C 76 50 52 50 40 58 Z" fill="#ffffff" opacity="0.45"/>
    </g>
  </svg>