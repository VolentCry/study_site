      <circle cx="64" cy="74" r="35" fill="url(#silverCoin)"/>
      <circle cx="64" cy="74" r="28" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <!-- Star -->
      <polygon points="64,56 67,65 77,66 69,73 72,82 64,77 56,82 59,73 51,66 61,65" fill="#ffffff"/>
      <!-- Highlight -->
