<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="ribbonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1d4ed8"/>
        <stop offset="50%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#1e40af"/>
      </linearGradient>
      <radialGradient id="silverCoin" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="35%" stop-color="#e2e8f0"/>
        <stop offset="75%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </radialGradient>
      <filter id="shadowMedalS" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.35"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="118" rx="30" ry="5" fill="#0f172a" opacity="0.2"/>
