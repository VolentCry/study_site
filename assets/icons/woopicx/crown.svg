<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="30%" stop-color="#facc15"/>
        <stop offset="70%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#a16207"/>
      </linearGradient>
      <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fca5a5"/>
        <stop offset="50%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#7f1d1d"/>
      </radialGradient>
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#86efac"/>
        <stop offset="50%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#064e3b"/>
      </radialGradient>
      <filter id="shadowCrown" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#713f12" flood-opacity="0.35"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="116" rx="36" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowCrown)">
      <!-- Velvet Cap Interior -->
      <path d="M 28 84 C 28 50 100 50 100 84 Z" fill="#991b1b"/>
      <!-- Golden Crown Body -->
      <path d="M 22 88 L 26 44 L 46 64 L 64 32 L 82 64 L 102 44 L 106 88 Z" fill="url(#crownGold)"/>
      <!-- Crown Base Rim -->
      <rect x="20" y="86" width="88" height="14" rx="4" fill="url(#crownGold)"/>
      <line x1="20" y1="87" x2="108" y2="87" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <!-- Pearls on Arch Tips -->
      <circle cx="26" cy="42" r="5" fill="#ffffff"/>
      <circle cx="64" cy="30" r="7" fill="#ffffff"/>
      <circle cx="102" cy="42" r="5" fill="#ffffff"/>
      <circle cx="46" cy="62" r="4" fill="#ffffff"/>
      <circle cx="82" cy="62" r="4" fill="#ffffff"/>
      <!-- Gems on band -->
      <ellipse cx="36" cy="93" rx="4" ry="4" fill="url(#emeraldGrad)"/>
      <ellipse cx="64" cy="93" rx="5" ry="5" fill="url(#rubyGrad)"/>
      <ellipse cx="92" cy="93" rx="4" ry="4" fill="url(#emeraldGrad)"/>
    </g>
  </svg>