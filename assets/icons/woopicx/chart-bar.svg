<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="bar1Top" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c084fc"/>
        <stop offset="100%" stop-color="#9333ea"/>
      </linearGradient>
      <linearGradient id="bar1Side" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7e22ce"/>
        <stop offset="100%" stop-color="#581c87"/>
      </linearGradient>
      <linearGradient id="bar2Top" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
      <linearGradient id="bar2Side" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0369a1"/>
        <stop offset="100%" stop-color="#075985"/>
      </linearGradient>
      <linearGradient id="bar3Top" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#16a34a"/>
      </linearGradient>
      <linearGradient id="bar3Side" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15803d"/>
        <stop offset="100%" stop-color="#14532d"/>
      </linearGradient>
      <filter id="shadowBars" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="116" rx="38" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowBars)">
      <!-- Isometric Base Plate -->
      <polygon points="64,88 114,104 64,120 14,104" fill="#334155"/>
      <!-- Bar 1 (Short - Left) -->
      <g transform="translate(0, 10)">
        <polygon points="34,70 48,76 48,100 34,94" fill="url(#bar1Side)"/>
        <polygon points="20,76 34,70 34,94 20,100" fill="#a855f7"/>
        <polygon points="34,64 48,70 34,76 20,70" fill="url(#bar1Top)"/>
      </g>
      <!-- Bar 2 (Medium - Center) -->
      <g transform="translate(0, -6)">
        <polygon points="64,54 78,60 78,102 64,96" fill="url(#bar2Side)"/>
        <polygon points="50,60 64,54 64,96 50,102" fill="#0ea5e9"/>
        <polygon points="64,48 78,54 64,60 50,54" fill="url(#bar2Top)"/>
      </g>
      <!-- Bar 3 (Tall - Right) -->
      <g transform="translate(0, -22)">
        <polygon points="94,38 108,44 108,104 94,98" fill="url(#bar3Side)"/>
        <polygon points="80,44 94,38 94,98 80,104" fill="#22c55e"/>
        <polygon points="94,32 108,38 94,44 80,38" fill="url(#bar3Top)"/>
      </g>
      <!-- Ascending Trend Arrow -->
      <path d="M 28 66 Q 60 40 98 22" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
      <polygon points="106,18 94,22 100,28" fill="#facc15"/>
