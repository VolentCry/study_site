<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#e2e8f0"/>
        <stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>
      <linearGradient id="rocketRed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f87171"/>
        <stop offset="60%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#991b1b"/>
      </linearGradient>
      <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="40%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#dc2626"/>
      </linearGradient>
      <radialGradient id="windowGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="50%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </radialGradient>
      <filter id="shadowRocket" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="-2" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3"/>
      </filter>
    </defs>
    <ellipse cx="44" cy="116" rx="28" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowRocket)">
      <!-- Flame Trail -->
      <path d="M 38 88 C 28 100, 20 114, 28 122 C 38 120, 52 108, 56 98 Z" fill="url(#flameGrad)"/>
      <path d="M 39 92 C 34 100, 30 110, 35 114 C 40 112, 48 104, 50 96 Z" fill="#fde047"/>
      <!-- Fins -->
      <path d="M 38 68 L 22 84 C 20 96, 32 98, 42 92 Z" fill="url(#rocketRed)"/>
      <path d="M 68 38 L 84 22 C 96 20, 98 32, 92 42 Z" fill="url(#rocketRed)"/>
      <!-- Fuselage -->
      <path d="M 44 84 C 36 68 46 44 80 20 C 104 44 92 80 66 88 Z" fill="url(#rocketBody)"/>
      <!-- Nosecone -->
      <path d="M 76 24 C 85 15 95 15 104 24 C 113 33 113 43 104 52 C 96 40 88 32 76 24 Z" fill="url(#rocketRed)"/>
      <!-- Circular Porthole Window -->
      <circle cx="68" cy="48" r="13" fill="#cbd5e1"/>
      <circle cx="68" cy="48" r="10" fill="url(#windowGrad)"/>
      <ellipse cx="66" cy="45" rx="5" ry="2.5" fill="#ffffff" opacity="0.7" transform="rotate(-45 66 45)"/>
      <!-- Highlight stripe -->
      <path d="M 52 74 C 64 56 80 40 92 34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>
  </svg>