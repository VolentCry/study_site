<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <radialGradient id="sphereGreen" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#86efac"/>
        <stop offset="35%" stop-color="#22c55e"/>
        <stop offset="75%" stop-color="#16a34a"/>
        <stop offset="100%" stop-color="#14532d"/>
      </radialGradient>
      <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f0fdf4"/>
        <stop offset="100%" stop-color="#bbf7d0"/>
      </linearGradient>
      <filter id="shadowCheck" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#14532d" flood-opacity="0.35"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="116" rx="34" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowCheck)">
      <!-- 3D Spherical Button -->
      <circle cx="64" cy="62" r="46" fill="url(#sphereGreen)"/>
      <!-- Top Specular Crescent -->
      <path d="M 32 46 C 42 26 86 26 96 46 C 84 32 44 32 32 46 Z" fill="#ffffff" opacity="0.45"/>
      <!-- 3D Embossed Checkmark -->
      <path d="M 40 62 L 56 78 L 88 44" fill="none" stroke="#14532d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="translate(1, 3)"/>
      <path d="M 40 62 L 56 78 L 88 44" fill="none" stroke="url(#checkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 40 62 L 56 78 L 88 44" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>
  </svg>