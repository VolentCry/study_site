<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="ribbonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6d28d9"/>
        <stop offset="50%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#5b21b6"/>
      </linearGradient>
      <radialGradient id="goldCoin" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fef9c3"/>
        <stop offset="35%" stop-color="#facc15"/>
        <stop offset="75%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#a16207"/>
      </radialGradient>
      <filter id="shadowMedalG" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#713f12" flood-opacity="0.35"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="118" rx="30" ry="5" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowMedalG)">
      <!-- Ribbon -->
      <polygon points="46,14 64,48 40,60 30,22" fill="url(#ribbonPurple)"/>
      <polygon points="82,14 64,48 88,60 98,22" fill="url(#ribbonPurple)"/>
      <!-- Gold Medallion -->
      <circle cx="64" cy="74" r="38" fill="#713f12"/>
      <circle cx="64" cy="74" r="35" fill="url(#goldCoin)"/>
      <circle cx="64" cy="74" r="28" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.9"/>
      <!-- Star -->
      <polygon points="64,56 67,65 77,66 69,73 72,82 64,77 56,82 59,73 51,66 61,65" fill="#ffffff"/>
      <!-- Sparkle -->
      <circle cx="86" cy="56" r="3" fill="#ffffff"/>
    </g>
  </svg>