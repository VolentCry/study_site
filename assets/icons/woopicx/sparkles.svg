<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="sparkleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#67e8f9"/>
        <stop offset="70%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
      <linearGradient id="sparkleGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#fde047"/>
        <stop offset="100%" stop-color="#f97316"/>
      </linearGradient>
      <filter id="glowSparkle" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <!-- Big Main Star -->
    <g filter="url(#glowSparkle)">
      <path d="M 60 14 C 60 38, 70 48, 94 48 C 70 48, 60 58, 60 82 C 60 58, 50 48, 26 48 C 50 48, 60 38, 60 14 Z" fill="url(#sparkleCyan)"/>
      <circle cx="60" cy="48" r="5" fill="#ffffff"/>
    </g>
    <!-- Secondary Star (Bottom-Right) -->
    <g filter="url(#glowSparkle)">
      <path d="M 88 70 C 88 84, 94 90, 108 90 C 94 90, 88 96, 88 110 C 88 96, 82 90, 68 90 C 82 90, 88 84, 88 70 Z" fill="url(#sparkleGold)"/>
      <circle cx="88" cy="90" r="3.5" fill="#ffffff"/>
    </g>
    <!-- Small Star (Bottom-Left) -->
    <g filter="url(#glowSparkle)">
      <path d="M 32 78 C 32 88, 36 92, 46 92 C 36 92, 32 96, 32 106 C 32 96, 28 92, 18 92 C 28 92, 32 88, 32 78 Z" fill="url(#sparkleCyan)"/>
      <circle cx="32" cy="92" r="2.5" fill="#ffffff"/>
    </g>
  </svg>