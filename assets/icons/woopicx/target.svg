<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <radialGradient id="targetRed" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#f87171"/>
        <stop offset="50%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#991b1b"/>
      </radialGradient>
      <radialGradient id="targetWhite" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#f1f5f9"/>
        <stop offset="100%" stop-color="#cbd5e1"/>
      </radialGradient>
      <radialGradient id="targetGold" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#a16207"/>
      </radialGradient>
      <filter id="shadowTarget" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="116" rx="34" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowTarget)">
      <!-- Outer Red Ring -->
      <circle cx="64" cy="64" r="48" fill="url(#targetRed)"/>
      <!-- Ring 2: White -->
      <circle cx="64" cy="64" r="37" fill="url(#targetWhite)"/>
      <!-- Ring 3: Red -->
      <circle cx="64" cy="64" r="26" fill="url(#targetRed)"/>
      <!-- Center Bullseye: Gold -->
      <circle cx="64" cy="64" r="15" fill="url(#targetGold)"/>
      <circle cx="60" cy="60" r="3" fill="#ffffff" opacity="0.8"/>
      <!-- Arrow Hitting Center -->
      <!-- Arrow shaft -->
      <line x1="64" y1="64" x2="102" y2="26" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
      <line x1="64" y1="64" x2="102" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <!-- Arrow Fletching (Feathers) -->
      <polygon points="98,24 108,18 104,30" fill="#38bdf8"/>
      <polygon points="104,30 110,40 98,34" fill="#0284c7"/>
      <polygon points="106,18 114,24 110,34" fill="#0ea5e9"/>
      <!-- Point Contact -->
      <circle cx="64" cy="64" r="4" fill="#0f172a"/>
    </g>
  </svg>