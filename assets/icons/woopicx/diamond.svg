<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="diaTable" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#bae6fd"/>
      </linearGradient>
      <linearGradient id="diaFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
      <linearGradient id="diaFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>
      <linearGradient id="diaFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <filter id="shadowDia" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0369a1" flood-opacity="0.35"/>
      </filter>
    </defs>
    <ellipse cx="64" cy="116" rx="32" ry="6" fill="#0f172a" opacity="0.2"/>
    <g filter="url(#shadowDia)">
      <!-- Crown / Upper Facets -->
      <polygon points="40,24 88,24 112,52 16,52" fill="url(#diaFacet1)"/>
      <polygon points="40,24 88,24 76,52 52,52" fill="url(#diaTable)"/>
      <polygon points="40,24 52,52 16,52" fill="url(#diaFacet3)"/>
      <polygon points="88,24 112,52 76,52" fill="url(#diaFacet2)"/>
      <!-- Pavilion / Lower Facets -->
      <polygon points="16,52 52,52 64,112" fill="url(#diaFacet1)"/>
      <polygon points="52,52 76,52 64,112" fill="url(#diaFacet3)"/>
      <polygon points="76,52 112,52 64,112" fill="url(#diaFacet2)"/>
      <!-- Specular Gleam -->
      <polygon points="36,20 40,26 46,28 40,30 36,36 32,30 26,28 32,26" fill="#ffffff"/>
      <polygon points="88,50 90,54 94,56 90,58 88,62 86,58 82,56 86,54" fill="#ffffff" opacity="0.8"/>
    </g>
  </svg>